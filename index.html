<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ward List">
<meta name="theme-color" content="#16232E">
<link rel="apple-touch-icon" href="icon.png">
<title>Thoracic Ward List</title>
<style>
  :root {
    --ink: #16232E;
    --paper: #F2F4F3;
    --card: #FFFFFF;
    --teal: #0E7C7B;
    --teal-dark: #0A5F5E;
    --alert: #C4452B;
    --amber: #B07D2B;
    --muted: #66757F;
    --line: #E1E6E4;
    --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { font-size: 16px; }
  body {
    font-family: var(--sans);
    background: var(--paper);
    color: var(--ink);
    padding-bottom: calc(90px + env(safe-area-inset-bottom));
  }
  header {
    background: var(--ink);
    color: #fff;
    padding: calc(14px + env(safe-area-inset-top)) 16px 14px;
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: baseline; justify-content: space-between;
  }
  header h1 { font-size: 1.05rem; font-weight: 700; letter-spacing: 0.02em; }
  header .count { font-family: var(--mono); font-size: 0.8rem; color: #9FB3BE; }

  .list { padding: 12px 12px 0; display: flex; flex-direction: column; gap: 12px; }

  .empty {
    text-align: center; color: var(--muted); padding: 70px 30px; line-height: 1.5;
  }
  .empty strong { color: var(--ink); display: block; margin-bottom: 6px; font-size: 1.05rem; }

  .card {
    background: var(--card);
    border-radius: 14px;
    border: 1px solid var(--line);
    overflow: hidden;
    box-shadow: 0 1px 2px rgba(22,35,46,0.06);
  }
  .card-top {
    display: flex; align-items: stretch; gap: 0;
    border-bottom: 1px solid var(--line);
  }
  .bed {
    background: var(--ink); color: #fff;
    min-width: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 10px 8px;
  }
  .bed .label { font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; color: #9FB3BE; }
  .bed .num { font-family: var(--mono); font-size: 1.35rem; font-weight: 700; }
  .who { flex: 1; padding: 10px 12px; min-width: 0; }
  .who .name-row { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .who .initials { font-size: 1.15rem; font-weight: 700; letter-spacing: 0.04em; }
  .who .age { font-family: var(--mono); font-size: 0.85rem; color: var(--muted); }
  .who .cons { font-size: 0.78rem; color: var(--teal-dark); font-weight: 600; margin-top: 2px; }
  .who .op-row { margin-top: 5px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .who .op { font-size: 0.86rem; }
  .pod {
    font-family: var(--mono); font-weight: 700; font-size: 0.78rem;
    background: var(--teal); color: #fff;
    padding: 2px 8px; border-radius: 6px; white-space: nowrap;
  }
  .chip {
    font-size: 0.7rem; font-weight: 600;
    padding: 2px 8px; border-radius: 6px;
    background: #EEF2F0; color: var(--muted);
    white-space: nowrap;
  }
  .chip.insulin { background: #F8ECE3; color: var(--amber); }
  .edit-btn {
    align-self: flex-start;
    margin: 10px 12px 0 0;
    background: none; border: none;
    color: var(--teal); font-size: 0.85rem; font-weight: 600;
    padding: 4px 6px;
  }

  .section { padding: 9px 12px; border-bottom: 1px solid var(--line); }
  .section:last-child { border-bottom: none; }
  .sec-label {
    font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); font-weight: 700; margin-bottom: 6px;
  }

  .drain { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: baseline; padding: 3px 0; }
  .drain + .drain { border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 7px; }
  .drain .d-name { font-weight: 700; font-size: 0.82rem; }
  .drain .d-item { font-size: 0.82rem; color: var(--ink); }
  .drain .d-item span { color: var(--muted); }
  .drain .d-item b { font-family: var(--mono); font-weight: 600; }
  .flag-clamped {
    font-size: 0.7rem; font-weight: 700; color: #fff; background: var(--alert);
    padding: 2px 8px; border-radius: 6px; letter-spacing: 0.04em;
  }
  .flag-leak { color: var(--alert); font-weight: 700; }
  .no-drains { font-size: 0.82rem; color: var(--muted); }

  .bloods { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .blood { text-align: center; background: #F6F8F7; border-radius: 8px; padding: 5px 2px; }
  .blood .b-label { font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); font-weight: 700; }
  .blood .b-val { font-family: var(--mono); font-size: 0.85rem; font-weight: 600; margin-top: 1px; }
  .blood .b-val.blank { color: #C2CBC8; }
  .meta-row { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 7px; }
  .meta-item { font-size: 0.78rem; color: var(--muted); }
  .meta-item b { font-family: var(--mono); color: var(--ink); font-weight: 600; }
  .stale { color: var(--amber); font-weight: 700; }

  .jobs .job { display: flex; align-items: center; gap: 10px; padding: 5px 0; }
  .jobs .job input[type=checkbox] {
    width: 21px; height: 21px; accent-color: var(--teal); flex-shrink: 0;
  }
  .jobs .job .j-text { font-size: 0.9rem; flex: 1; }
  .jobs .job.done .j-text { color: var(--muted); text-decoration: line-through; }
  .jobs .j-del { background: none; border: none; color: #C2CBC8; font-size: 1rem; padding: 2px 6px; }
  .job-add { display: flex; gap: 8px; margin-top: 6px; }
  .job-add input {
    flex: 1; border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 10px; font-size: 0.9rem; font-family: var(--sans); background: #FAFBFA;
  }
  .job-add button {
    background: var(--teal); color: #fff; border: none; border-radius: 8px;
    padding: 0 14px; font-size: 0.85rem; font-weight: 700;
  }

  .fab {
    position: fixed; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom));
    width: 58px; height: 58px; border-radius: 50%;
    background: var(--teal); color: #fff; border: none;
    font-size: 1.9rem; line-height: 1;
    box-shadow: 0 4px 14px rgba(14,124,123,0.4);
    z-index: 60;
  }

  /* Edit sheet */
  .sheet {
    position: fixed; inset: 0; background: var(--paper); z-index: 100;
    overflow-y: auto; -webkit-overflow-scrolling: touch;
    display: none;
  }
  .sheet.open { display: block; }
  .sheet-bar {
    position: sticky; top: 0; background: var(--ink); color: #fff; z-index: 10;
    padding: calc(12px + env(safe-area-inset-top)) 16px 12px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .sheet-bar h2 { font-size: 1rem; }
  .sheet-bar button {
    background: none; border: none; color: #9FB3BE; font-size: 0.95rem; padding: 4px 8px;
  }
  .sheet-bar button.save { color: #fff; font-weight: 700; background: var(--teal); border-radius: 8px; padding: 7px 16px; }
  .form { padding: 14px 14px calc(50px + env(safe-area-inset-bottom)); }
  .fgroup {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 12px; margin-bottom: 12px;
  }
  .fgroup h3 {
    font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em;
    color: var(--muted); margin-bottom: 10px;
  }
  .frow { display: flex; gap: 10px; }
  .frow > * { flex: 1; min-width: 0; }
  .field { margin-bottom: 10px; }
  .field:last-child { margin-bottom: 0; }
  .field label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .field input, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    padding: 10px; font-size: 0.95rem; font-family: var(--sans);
    background: #FAFBFA; color: var(--ink); appearance: none;
  }
  .field input[type=date] { min-height: 42px; }
  .field .mono { font-family: var(--mono); }
  .drain-block { border: 1px dashed var(--line); border-radius: 10px; padding: 10px; margin-bottom: 10px; position: relative; }
  .drain-block .d-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
  .drain-block .d-head b { font-size: 0.82rem; }
  .drain-block .d-head button { background: none; border: none; color: var(--alert); font-size: 0.8rem; font-weight: 600; }
  .toggle-row { display: flex; align-items: center; justify-content: space-between; padding-top: 2px; }
  .toggle-row label { font-size: 0.85rem; font-weight: 600; }
  .toggle-row input { width: 22px; height: 22px; accent-color: var(--alert); }
  .add-drain, .danger {
    width: 100%; border-radius: 10px; padding: 12px; font-size: 0.9rem; font-weight: 700; border: none;
  }
  .add-drain { background: #E5F1F0; color: var(--teal-dark); margin-bottom: 2px; }
  .danger { background: #F9ECE8; color: var(--alert); margin-top: 4px; }
  .storage-warn {
    background: #F8ECE3; color: var(--amber); font-size: 0.78rem;
    padding: 8px 14px; text-align: center; display: none;
  }
</style>
</head>
<body>

<header>
  <h1>Thoracic Ward List</h1>
  <span class="count" id="count"></span>
</header>
<div class="storage-warn" id="storageWarn">Saving unavailable in this browser session. Data will be lost when the page closes.</div>

<div class="list" id="list"></div>

<button class="fab" id="addBtn" aria-label="Add patient">+</button>

<div class="sheet" id="sheet">
  <div class="sheet-bar">
    <button id="cancelBtn">Cancel</button>
    <h2 id="sheetTitle">New patient</h2>
    <button class="save" id="saveBtn">Save</button>
  </div>
  <div class="form">

    <div class="fgroup">
      <h3>Patient</h3>
      <div class="frow">
        <div class="field"><label>Initials</label><input id="f_initials" autocapitalize="characters" placeholder="AB"></div>
        <div class="field"><label>Bed</label><input id="f_bed" class="mono" placeholder="12"></div>
        <div class="field"><label>Age</label><input id="f_age" class="mono" inputmode="numeric" placeholder="67"></div>
      </div>
      <div class="field"><label>Consultant</label><input id="f_cons" placeholder="Mr ..."></div>
      <div class="field"><label>Diabetic status</label>
        <select id="f_dm">
          <option value="">Not diabetic</option>
          <option>Diet controlled</option>
          <option>Oral medication</option>
          <option>Insulin</option>
        </select>
      </div>
    </div>

    <div class="fgroup">
      <h3>Operation</h3>
      <div class="field"><label>Operation</label><input id="f_op" placeholder="VATS RUL lobectomy"></div>
      <div class="field"><label>Date of surgery</label><input type="date" id="f_dos"></div>
    </div>

    <div class="fgroup">
      <h3>Drains</h3>
      <div id="drainForms"></div>
      <button class="add-drain" id="addDrainBtn" type="button">+ Add drain</button>
    </div>

    <div class="fgroup">
      <h3>Imaging</h3>
      <div class="field"><label>Latest CXR date</label><input type="date" id="f_cxr"></div>
    </div>

    <div class="fgroup">
      <h3>Latest bloods</h3>
      <div class="field"><label>Date taken</label><input type="date" id="f_bldDate"></div>
      <div class="frow">
        <div class="field"><label>Hb</label><input id="f_hb" class="mono" inputmode="decimal"></div>
        <div class="field"><label>WCC</label><input id="f_wcc" class="mono" inputmode="decimal"></div>
        <div class="field"><label>CRP</label><input id="f_crp" class="mono" inputmode="decimal"></div>
      </div>
      <div class="frow">
        <div class="field"><label>Na</label><input id="f_na" class="mono" inputmode="decimal"></div>
        <div class="field"><label>K</label><input id="f_k" class="mono" inputmode="decimal"></div>
        <div class="field"><label>Creat</label><input id="f_cr" class="mono" inputmode="decimal"></div>
      </div>
    </div>

    <button class="danger" id="deleteBtn" type="button" style="display:none">Discharge / remove patient</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ---------- storage (with in memory fallback) ----------
  var KEY = "thoracic_ward_list_v1";
  var memStore = null;
  var canStore = (function () {
    try {
      localStorage.setItem("__t", "1");
      localStorage.removeItem("__t");
      return true;
    } catch (e) { return false; }
  })();
  if (!canStore) document.getElementById("storageWarn").style.display = "block";

  function load() {
    try {
      var raw = canStore ? localStorage.getItem(KEY) : memStore;
      return raw ? JSON.parse(raw) : [];
    } catch (e) { return []; }
  }
  function persist() {
    var raw = JSON.stringify(patients);
    if (canStore) { try { localStorage.setItem(KEY, raw); } catch (e) {} }
    else memStore = raw;
  }

  var patients = load();
  var editingId = null;
  var draftDrains = [];

  // ---------- helpers ----------
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function daysSince(iso) {
    if (!iso) return null;
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return null;
    var now = new Date();
    var today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((today - d) / 86400000);
  }
  function fmtDate(iso) {
    if (!iso) return "";
    var d = new Date(iso + "T00:00:00");
    if (isNaN(d)) return "";
    var months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate() + " " + months[d.getMonth()];
  }
  function ago(iso) {
    var n = daysSince(iso);
    if (n === null) return "";
    if (n === 0) return "today";
    if (n === 1) return "1d ago";
    return n + "d ago";
  }
  function bedSort(a, b) {
    var na = parseFloat(a.bed), nb = parseFloat(b.bed);
    if (!isNaN(na) && !isNaN(nb) && na !== nb) return na - nb;
    return String(a.bed).localeCompare(String(b.bed), undefined, { numeric: true });
  }

  // ---------- render ----------
  var listEl = document.getElementById("list");

  function bloodTile(label, val) {
    var has = val !== "" && val != null;
    return '<div class="blood"><div class="b-label">' + label + '</div>' +
      '<div class="b-val' + (has ? "" : " blank") + '">' + (has ? esc(val) : "\u2013") + "</div></div>";
  }

  function drainLine(d, i) {
    var bits = [];
    bits.push('<span class="d-name">Drain ' + (i + 1) + "</span>");
    if (d.airLeak && d.airLeak !== "None") {
      bits.push('<span class="d-item"><span>Leak</span> <span class="flag-leak">' + esc(d.airLeak) + "</span></span>");
    } else {
      bits.push('<span class="d-item"><span>Leak</span> none</span>');
    }
    bits.push('<span class="d-item"><span>Suction</span> <b>' + (d.suction ? esc(d.suction) : "off") + "</b></span>");
    var out = (d.output !== "" && d.output != null) ? esc(d.output) + " ml" : "\u2013";
    var fluid = d.fluid ? " " + esc(d.fluid).toLowerCase() : "";
    bits.push('<span class="d-item"><span>Output</span> <b>' + out + "</b>" + fluid + "</span>");
    if (d.clamped) bits.push('<span class="flag-clamped">CLAMPED</span>');
    return '<div class="drain">' + bits.join("") + "</div>";
  }

  function card(p) {
    var pod = daysSince(p.dos);
    var podTxt = pod === null ? "" : (pod === 0 ? "Day of surgery" : "D" + pod);
    var dmChip = p.dm ? '<span class="chip' + (p.dm === "Insulin" ? " insulin" : "") + '">DM: ' + esc(p.dm) + "</span>" : "";
    var drainsHtml = (p.drains && p.drains.length)
      ? p.drains.map(drainLine).join("")
      : '<div class="no-drains">No drains in situ</div>';
    var cxrN = daysSince(p.cxr);
    var cxrTxt = p.cxr
      ? "<b>" + fmtDate(p.cxr) + "</b> (" + (cxrN >= 2 ? '<span class="stale">' + ago(p.cxr) + "</span>" : ago(p.cxr)) + ")"
      : "<b>\u2013</b>";
    var bldTxt = p.bldDate ? " \u00B7 " + fmtDate(p.bldDate) + " (" + ago(p.bldDate) + ")" : "";
    var jobs = (p.jobs || []).map(function (j) {
      return '<div class="job' + (j.done ? " done" : "") + '">' +
        '<input type="checkbox" ' + (j.done ? "checked" : "") + ' data-act="togglejob" data-p="' + p.id + '" data-j="' + j.id + '">' +
        '<span class="j-text">' + esc(j.text) + "</span>" +
        '<button class="j-del" data-act="deljob" data-p="' + p.id + '" data-j="' + j.id + '">\u2715</button></div>';
    }).join("");

    return '<div class="card">' +
      '<div class="card-top">' +
        '<div class="bed"><span class="label">Bed</span><span class="num">' + esc(p.bed || "?") + "</span></div>" +
        '<div class="who">' +
          '<div class="name-row"><span class="initials">' + esc(p.initials || "?") + "</span>" +
          '<span class="age">' + (p.age ? esc(p.age) + "y" : "") + "</span>" + dmChip + "</div>" +
          (p.cons ? '<div class="cons">' + esc(p.cons) + "</div>" : "") +
          '<div class="op-row">' + (podTxt ? '<span class="pod">' + podTxt + "</span>" : "") +
          '<span class="op">' + esc(p.op || "") + "</span></div>" +
        "</div>" +
        '<button class="edit-btn" data-act="edit" data-p="' + p.id + '">Edit</button>' +
      "</div>" +
      '<div class="section"><div class="sec-label">Drains</div>' + drainsHtml + "</div>" +
      '<div class="section"><div class="sec-label">Bloods' + bldTxt + "</div>" +
        '<div class="bloods">' +
          bloodTile("Hb", p.hb) + bloodTile("WCC", p.wcc) + bloodTile("CRP", p.crp) +
          bloodTile("Na", p.na) + bloodTile("K", p.k) + bloodTile("Cr", p.cr) +
        "</div>" +
        '<div class="meta-row"><span class="meta-item">Latest CXR: ' + cxrTxt + "</span></div>" +
      "</div>" +
      '<div class="section jobs"><div class="sec-label">Jobs</div>' + jobs +
        '<div class="job-add"><input placeholder="Add a job..." data-jobinput="' + p.id + '">' +
        '<button data-act="addjob" data-p="' + p.id + '">Add</button></div>' +
      "</div>" +
    "</div>";
  }

  function render() {
    patients.sort(bedSort);
    document.getElementById("count").textContent = patients.length + (patients.length === 1 ? " patient" : " patients");
    if (!patients.length) {
      listEl.innerHTML = '<div class="empty"><strong>No patients on the list</strong>Tap + to add your first patient.</div>';
      return;
    }
    listEl.innerHTML = patients.map(card).join("");
  }

  // ---------- drain form rows ----------
  var drainFormsEl = document.getElementById("drainForms");
  function renderDrainForms() {
    drainFormsEl.innerHTML = draftDrains.map(function (d, i) {
      return '<div class="drain-block">' +
        '<div class="d-head"><b>Drain ' + (i + 1) + '</b><button type="button" data-deldrain="' + i + '">Remove</button></div>' +
        '<div class="frow">' +
          '<div class="field"><label>Air leak</label><select data-df="airLeak" data-di="' + i + '">' +
            ["None","Swing only","Small","Moderate","Large","Continuous"].map(function (o) {
              return "<option" + (d.airLeak === o ? " selected" : "") + ">" + o + "</option>";
            }).join("") + "</select></div>" +
          '<div class="field"><label>Suction</label><input data-df="suction" data-di="' + i + '" value="' + esc(d.suction) + '" placeholder="2 kPa / off"></div>' +
        "</div>" +
        '<div class="frow">' +
          '<div class="field"><label>Output (ml / 24h)</label><input class="mono" inputmode="numeric" data-df="output" data-di="' + i + '" value="' + esc(d.output) + '"></div>' +
          '<div class="field"><label>Fluid type</label><select data-df="fluid" data-di="' + i + '">' +
            ["","Serous","Haemoserous","Serosanguinous","Frank blood","Chylous","Purulent","Air only"].map(function (o) {
              return '<option value="' + o + '"' + (d.fluid === o ? " selected" : "") + ">" + (o || "\u2013") + "</option>";
            }).join("") + "</select></div>" +
        "</div>" +
        '<div class="toggle-row"><label>Clamped</label><input type="checkbox" data-df="clamped" data-di="' + i + '"' + (d.clamped ? " checked" : "") + "></div>" +
      "</div>";
    }).join("");
  }
  drainFormsEl.addEventListener("input", function (e) {
    var f = e.target.getAttribute("data-df");
    if (!f) return;
    var i = +e.target.getAttribute("data-di");
    draftDrains[i][f] = f === "clamped" ? e.target.checked : e.target.value;
  });
  drainFormsEl.addEventListener("click", function (e) {
    var del = e.target.getAttribute("data-deldrain");
    if (del != null) { draftDrains.splice(+del, 1); renderDrainForms(); }
  });
  document.getElementById("addDrainBtn").addEventListener("click", function () {
    draftDrains.push({ airLeak: "None", suction: "", output: "", fluid: "", clamped: false });
    renderDrainForms();
  });

  // ---------- sheet open/close ----------
  var sheet = document.getElementById("sheet");
  var fields = ["initials","bed","age","cons","dm","op","dos","cxr","bldDate","hb","wcc","crp","na","k","cr"];
  function fEl(name) {
    var map = { initials:"f_initials", bed:"f_bed", age:"f_age", cons:"f_cons", dm:"f_dm", op:"f_op",
      dos:"f_dos", cxr:"f_cxr", bldDate:"f_bldDate", hb:"f_hb", wcc:"f_wcc", crp:"f_crp", na:"f_na", k:"f_k", cr:"f_cr" };
    return document.getElementById(map[name]);
  }
  function openSheet(p) {
    editingId = p ? p.id : null;
    document.getElementById("sheetTitle").textContent = p ? "Edit patient" : "New patient";
    document.getElementById("deleteBtn").style.display = p ? "block" : "none";
    fields.forEach(function (f) { fEl(f).value = p ? (p[f] || "") : ""; });
    draftDrains = p ? JSON.parse(JSON.stringify(p.drains || [])) : [];
    renderDrainForms();
    sheet.classList.add("open");
    sheet.scrollTop = 0;
  }
  function closeSheet() { sheet.classList.remove("open"); }

  document.getElementById("addBtn").addEventListener("click", function () { openSheet(null); });
  document.getElementById("cancelBtn").addEventListener("click", closeSheet);

  document.getElementById("saveBtn").addEventListener("click", function () {
    var data = {};
    fields.forEach(function (f) { data[f] = fEl(f).value.trim(); });
    if (!data.initials && !data.bed) { alert("Enter at least initials or a bed number."); return; }
    data.drains = draftDrains;
    if (editingId) {
      var p = patients.find(function (x) { return x.id === editingId; });
      if (p) { data.jobs = p.jobs || []; data.id = p.id; Object.assign(p, data); }
    } else {
      data.id = uid();
      data.jobs = [];
      patients.push(data);
    }
    persist(); render(); closeSheet();
  });

  document.getElementById("deleteBtn").addEventListener("click", function () {
    if (!editingId) return;
    if (!confirm("Remove this patient from the list?")) return;
    patients = patients.filter(function (x) { return x.id !== editingId; });
    persist(); render(); closeSheet();
  });

  // ---------- list interactions ----------
  listEl.addEventListener("click", function (e) {
    var act = e.target.getAttribute("data-act");
    if (!act) return;
    var pid = e.target.getAttribute("data-p");
    var p = patients.find(function (x) { return x.id === pid; });
    if (!p) return;

    if (act === "edit") openSheet(p);

    if (act === "addjob") {
      var input = listEl.querySelector('[data-jobinput="' + pid + '"]');
      var text = input.value.trim();
      if (!text) return;
      p.jobs = p.jobs || [];
      p.jobs.push({ id: uid(), text: text, done: false });
      persist(); render();
    }

    if (act === "togglejob" || act === "deljob") {
      var jid = e.target.getAttribute("data-j");
      p.jobs = p.jobs || [];
      if (act === "deljob") p.jobs = p.jobs.filter(function (j) { return j.id !== jid; });
      else {
        var j = p.jobs.find(function (x) { return x.id === jid; });
        if (j) j.done = !j.done;
      }
      persist(); render();
    }
  });

  // allow pressing return in the job input
  listEl.addEventListener("keydown", function (e) {
    if (e.key !== "Enter") return;
    var pid = e.target.getAttribute("data-jobinput");
    if (!pid) return;
    var p = patients.find(function (x) { return x.id === pid; });
    var text = e.target.value.trim();
    if (!p || !text) return;
    p.jobs = p.jobs || [];
    p.jobs.push({ id: uid(), text: text, done: false });
    persist(); render();
  });

  render();

  // refresh post op day counts if the app stays open past midnight
  setInterval(render, 60 * 60 * 1000);
})();
</script>
</body>
</html>
